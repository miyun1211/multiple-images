<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ビールレビュー投稿</title>
    <style>
        :root {
            --amber: #fda90d;
            --dark: #332211;
            --gray: #e4e1e1;
            --slider-track-height: 12px;
            --slider-thumb-size: 26px;
            /* 少し大きくして掴みやすく */
            --slider-left: #a0d8ef;
            --slider-right: #f0b2d0;
        }

        body {
            font-family: sans-serif;
            color: var(--dark);
            background: var(--gray);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin: auto;
        }

        h2 {
            text-align: center;
            color: var(--amber);
        }

        /* 商品情報トグル */
        .product-info-toggle {
            cursor: pointer;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            border: 1px solid #eee;
            /* 枠線を追加するとよりボタンらしくなります */
        }

        /* 通常時（閉じている時）は「＋」を表示 */
        .product-info-toggle::after {
            content: '＋';
            font-size: 1.2em;
            font-weight: bold;
            transition: transform 0.3s;
        }

        /* activeクラスがついた時（開いている時）は「ー」を表示 */
        .product-info-toggle.active::after {
            content: 'ー';
            transform: none;
            /* 回転は不要なので解除 */
        }

        .product-info-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background-color: #fff;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 5px 5px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .product-info-inner {
            padding: 15px;
            display: flex;
            align-items: center;
        }

        .product-image {
            width: 80px;
            height: 80px;
            background-color: #ddd;
            border-radius: 5px;
            margin-right: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-size: 0.8em;
        }

        .product-details h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .product-details p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .section {
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* 星評価 */
        .star-rating {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            font-size: 2rem;
            cursor: pointer;
        }

        .star-rating input {
            display: none;
        }

        .star-rating label {
            color: #ccc;
            transition: color 0.2s;
            margin: 0 5px;
        }

        .star-rating input:checked~label,
        .star-rating label:hover,
        .star-rating label:hover~label {
            color: var(--amber);
        }

        .range-group {
            margin: 20px 0;
        }

        /* CSS:スライダー */
        /* 数値バッジのデザイン */
        .current-value {
            background: var(--amber);
            /* つまみと同じ色 */
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            min-width: 35px;
            text-align: center;
        }

        /* 項目名と数値を左右に振り分ける */
        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: -5px;
            font-weight: bold;
        }

        /* 数値ラベルの枠線デザイン */
        .current-value-label {
            font-size: 0.85rem;
            color: var(--amber);
            /* 文字色をアンバーに */
            width: 45px;
            /* 枠の幅 */
            height: 24px;
            /* 枠の高さ */
            line-height: 22px;
            /* 文字を垂直中央に */
            text-align: center;
            /* 文字を水平中央に */
            border: 1.5px solid var(--amber);
            /* ここで枠線を追加 */
            border-radius: 4px;
            /* 角を少し丸く（不要なら0に） */
            display: inline-block;
            font-weight: bold;
        }

        /* #val-aroma-left {
            text-align: left; #左の数値は左寄せ
        }

        #val-aroma-right {
            text-align: right; #右の数値は右寄せ
        } */


        /* CSS：ボタン */
        .rating-buttons {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .rating-buttons input {
            display: none;
            /* ラジオボタン本体は隠す */
        }

        .rating-buttons label {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            margin: 0 4px;
            background: #eee;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            color: #666;
        }

        /* 選択されたボタンの色（左側は水色っぽく、右側はピンクっぽくするのもアリです） */
        .rating-buttons input:checked+label {
            background: var(--amber);
            color: white;
            transform: scale(1.05);
        }


        .range-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #666;
            margin-top: -8px;
        }

        /* --- スライダーのスムーズ化 --- */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: var(--slider-track-height);
            background: #eee;
            border-radius: calc(var(--slider-track-height) / 2);
            outline: none;
            cursor: pointer;
            margin: 10px 0;
            /* 背景の分割設定をクリア */
            background-image: none;
        }

        /* つまみ (Chrome/Safari) */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: var(--slider-thumb-size);
            height: var(--slider-thumb-size);
            background: var(--amber);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
            margin-top: -7px;
            /* トラックの中央に配置 */
        }

        /* つまみ (Firefox) */
        input[type="range"]::-moz-range-thumb {
            width: var(--slider-thumb-size);
            height: var(--slider-thumb-size);
            background: var(--amber);
            border: 3px solid #fff;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }

        input[type="range"]:active::-webkit-slider-thumb {
            transform: scale(1.15);
        }

        input[type="text"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .submit-btn {
            background: var(--amber);
            color: var(--dark);
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>

    <script>
        // 商品情報
        function toggleProductInfo() {
            const toggle = document.querySelector('.product-info-toggle');
            const content = document.getElementById('productInfoContent');

            // activeクラスをつけ外しすることで、CSS側の「＋/ー」が切り替わります
            toggle.classList.toggle('active');

            // コンテンツの開閉処理
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
        }

        // スライダー
        function updateSliderDisplay(el) {
            const val = parseFloat(el.value);
            const min = parseFloat(el.min || 1);
            const max = parseFloat(el.max || 5);

            // 背景色のためのパーセント計算
            const percent = ((val - min) / (max - min)) * 100;
            el.style.background = `linear-gradient(to right, #a0d8ef 0%, #a0d8ef ${percent}%, #f0b2d0 ${percent}%, #f0b2d0 100%)`;

            // 数値を「3.0」のような形式で表示
            const targetId = el.getAttribute('data-target');
            if (targetId) {
                const levelLabel = document.getElementById(`${targetId}-level`);
                if (levelLabel) {
                    levelLabel.innerText = val.toFixed(1); // 小数点第1位まで表示
                }
            }
        }

        // 全てのラジオボタンにイベントを設定
        document.querySelectorAll('.rating-buttons input').forEach(input => {
            input.addEventListener('change', (e) => {
                const name = e.target.name;
                const val = e.target.value;
                // 対応するラベル（例：val-aroma-level）を書き換え
                const label = document.getElementById(`val-${name}-level`);
                if (label) label.innerText = val;
            });
        });

        // コメント
        const sliders = document.querySelectorAll('.dynamic-slider');
        sliders.forEach(slider => {
            updateSliderDisplay(slider);
            slider.addEventListener('input', (e) => {
                updateSliderDisplay(e.target);
            });
        });

        // フォームの送信イベントを制御
        document.getElementById('reviewForm').addEventListener('submit', function (e) {
            e.preventDefault(); // ページのリロードを防ぐ

            // 1. 入力された値を取得する
            const formData = new FormData(this);
            const rating = formData.get('rating') || '未評価';
            const title = formData.get('title') || '（タイトルなし）';
            const comment = formData.get('comment') || '（コメントなし）';

            // 5段階評価の各数値を取得
            const aroma = formData.get('aroma');
            const bitter = formData.get('bitter');
            const sweet = formData.get('sweet_malt');
            const body = formData.get('body');
            const drink = formData.get('drinkability');
            const cost = formData.get('cost_performance');

            // 2. 完了画面（プレビュー付き）に書き換える
            document.querySelector('.container').innerHTML = `
                <div style="text-align: center; padding: 20px 0;">
                    <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
                    <h2 style="color: var(--amber); margin-bottom: 5px;">投稿が完了しました！</h2>
                    <p style="color: #666; font-size: 0.9rem;">素敵なレビューをありがとうございます。</p>
                    
                    <div style="text-align: left; background: #f9f9f9; border-radius: 10px; padding: 20px; margin: 30px 0; border: 1px solid #eee;">
                        <p style="font-weight: bold; color: var(--amber); margin-bottom: 15px; border-bottom: 2px solid var(--amber); display: inline-block;">投稿のプレビュー</p>
                        
                        <div style="margin-bottom: 15px;">
                            <span style="color: var(--amber); font-size: 1.2rem;">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</span>
                            <strong style="margin-left: 10px; font-size: 1.1rem;">${title}</strong>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                            <div>香り: <strong>Lv ${aroma}</strong></div>
                            <div>苦味: <strong>Lv ${bitter}</strong></div>
                            <div>甘味: <strong>Lv ${sweet}</strong></div>
                            <div>コク: <strong>Lv ${body}</strong></div>
                            <div>飲みやすさ: <strong>Lv ${drink}</strong></div>
                            <div>コスパ: <strong>Lv ${cost}</strong></div>
                        </div>

                        <p style="font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; color: #332211;">${comment}</p>
                    </div>

                    <button onclick="location.reload()" class="submit-btn" style="width: auto; padding: 12px 40px;">
                        トップに戻る
                    </button>
                </div>
            `;

            // 画面上部へスクロールさせる
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
